<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FindLeads | Zero-Cost Open Source Lead Generation</title>
  <meta name="description" content="Find local businesses with no website. 100% free, browser-based, powered by OpenStreetMap." />
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: '#1E293B',
            secondary: '#334155',
            accent: '#22C55E',
            background: '#0F172A',
            foreground: '#F8FAFC',
            card: '#1B2336',
            muted: '#272F42',
            border: '#475569',
          }
        }
      }
    }
  </script>
  
  <!-- Custom Styles (Keyframes & Scrollbars) -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-background text-foreground min-h-screen flex flex-col font-sans selection:bg-accent selection:text-white">

  <!-- Nav Header -->
  <header class="sticky top-0 z-40 w-full backdrop-blur-xl bg-background/80 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🎯</span>
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent tracking-tight">FindLeads</h1>
      </div>
      <nav class="flex items-center gap-4">
        <button id="btn-how-it-works" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">How It Works</button>
        <button id="btn-history" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">History</button>
        <button id="btn-saved" class="text-sm font-medium px-3 py-1.5 rounded-md bg-white/5 hover:bg-white/10 border border-white/10 transition-colors">⭐ Saved Lists</button>
      </nav>
    </div>
  </header>

  <main class="flex-grow flex flex-col items-center pt-12 pb-24 px-4 sm:px-6">
    
    <!-- Hero Section -->
    <div class="text-center max-w-3xl mx-auto mb-10 space-y-4">
      <h2 class="text-4xl sm:text-5xl font-extrabold tracking-tight">
        Find Businesses with <span class="bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">No Website</span>
      </h2>
      <p class="text-lg text-slate-400">
        100% free lead generation. No API keys, no sign-ups, no backend. 
        Powered by public OpenStreetMap data.
      </p>
    </div>

    <!-- Search Card -->
    <div class="w-full max-w-4xl bg-card/80 backdrop-blur-lg border border-white/10 rounded-2xl p-6 sm:p-8 shadow-2xl relative">
      <form id="search-form" class="flex flex-col sm:flex-row gap-4">
        
        <!-- Category Dropdown -->
        <div class="flex-1 relative">
          <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Business Type</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
            <select id="category-input" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 pl-10 pr-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none cursor-pointer">
              <!-- Options populated via JS -->
            </select>
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">▼</span>
          </div>
        </div>

        <!-- Location Input with Autocomplete -->
        <div class="flex-1 relative">
          <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Location</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">📍</span>
            <input type="text" id="location-input" required autocomplete="off" placeholder="e.g. Austin, TX" 
              class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 pl-10 pr-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            
            <!-- Autocomplete Dropdown -->
            <div id="location-suggestions" class="absolute z-50 w-full mt-2 bg-slate-800 border border-slate-700 rounded-lg shadow-xl overflow-hidden hidden">
              <ul id="location-suggestions-list" class="max-h-60 overflow-y-auto hide-scrollbar py-1">
                <!-- Suggestions populated via JS -->
              </ul>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="sm:pt-6 flex items-end">
          <button type="submit" id="btn-search" class="w-full sm:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center gap-2">
            Search Leads 🚀
          </button>
        </div>
      </form>
    </div>

    <!-- Loading / Status Banner -->
    <div id="status-container" class="mt-8 hidden flex-col items-center gap-3">
      <div class="w-8 h-8 border-4 border-blue-500/30 border-t-blue-500 rounded-full animate-spin"></div>
      <p id="status-message" class="text-sm font-medium text-blue-400 bg-blue-500/10 px-4 py-2 rounded-full"></p>
    </div>

    <!-- Error Banner -->
    <div id="error-banner" class="mt-8 hidden max-w-2xl w-full bg-red-950/50 border border-red-500/30 rounded-xl p-4 flex items-start gap-4">
      <span class="text-2xl">⚠️</span>
      <div class="flex-grow">
        <h4 class="text-red-400 font-semibold mb-1">Search Failed</h4>
        <p id="error-message" class="text-red-200/80 text-sm mb-3"></p>
        <button id="btn-retry" class="text-xs bg-red-500/20 hover:bg-red-500/30 text-red-300 px-3 py-1.5 rounded transition-colors border border-red-500/20">
          Try Again
        </button>
      </div>
    </div>

    <!-- Results Section -->
    <div id="results-section" class="w-full max-w-7xl mt-12 hidden">
      <!-- Toolbar -->
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6 pb-4 border-b border-white/10">
        <h3 id="results-count" class="text-lg font-medium text-slate-300"></h3>
        
        <div class="flex flex-wrap items-center gap-4">
          <label class="flex items-center gap-2 cursor-pointer group">
            <div class="relative">
              <input type="checkbox" id="toggle-no-website" checked class="sr-only">
              <div class="block bg-slate-700 w-10 h-6 rounded-full transition-colors group-hover:bg-slate-600"></div>
              <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform transform translate-x-4"></div>
            </div>
            <span class="text-sm font-medium text-slate-300">No Website Only</span>
          </label>
          
          <select id="sort-select" class="bg-slate-800 border border-slate-700 text-sm rounded-md px-3 py-1.5 text-slate-300 focus:outline-none focus:ring-1 focus:ring-blue-500">
            <option value="leads">Leads First</option>
            <option value="name">Name (A-Z)</option>
          </select>

          <button id="btn-export-csv" class="px-3 py-1.5 text-sm bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 rounded-md transition-colors flex items-center gap-2">
            <span>⬇️</span> Export CSV
          </button>
        </div>
      </div>

      <!-- Grid -->
      <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
        <!-- Cards injected via JS -->
      </div>

      <!-- Load More -->
      <div class="mt-10 text-center">
        <button id="btn-load-more" class="hidden px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full transition-colors border border-slate-700">
          Load More Results
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto py-6 text-center text-xs text-slate-500 border-t border-white/5">
    <p>Data provided by <a href="https://www.openstreetmap.org/copyright" target="_blank" class="text-slate-400 hover:text-white underline">OpenStreetMap</a> contributors.</p>
    <p class="mt-1">FindLeads is open source. 100% free forever.</p>
  </footer>

  <!-- Slide-out Panels (History / Saved) -->
  <div id="side-panel-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden transition-opacity opacity-0"></div>
  
  <div id="side-panel" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-slate-900 border-l border-white/10 z-50 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="p-5 border-b border-white/10 flex justify-between items-center bg-slate-900/50">
      <h3 id="panel-title" class="text-lg font-semibold">Panel</h3>
      <button id="btn-close-panel" class="text-slate-400 hover:text-white p-2 rounded-full hover:bg-white/5">✕</button>
    </div>
    <div id="panel-content" class="p-5 flex-grow overflow-y-auto space-y-4">
      <!-- Content injected via JS -->
    </div>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center transition-opacity opacity-0 p-4">
    <div id="modal-content" class="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-300">
      <div class="flex justify-between items-start mb-4">
        <h3 id="modal-title" class="text-xl font-bold">Modal</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white p-1 rounded-md hover:bg-white/5">✕</button>
      </div>
      <div id="modal-body" class="text-slate-300 text-sm space-y-4">
        <!-- Content injected via JS -->
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- Template: Business Card -->
  <template id="tpl-business-card">
    <div class="business-card bg-card border border-white/5 hover:border-white/20 rounded-xl p-5 transition-all hover:shadow-xl hover:-translate-y-1 flex flex-col h-full group">
      <div class="flex justify-between items-start mb-3 gap-2">
        <h4 class="name text-lg font-semibold text-white leading-tight"></h4>
        <div class="badge flex-shrink-0 text-xs px-2.5 py-1 rounded-full flex items-center gap-1.5 font-medium"></div>
      </div>
      
      <div class="space-y-2 mt-auto pt-4 text-sm text-slate-300">
        <div class="flex items-start gap-2">
          <span class="mt-0.5 text-slate-500">📍</span>
          <span class="address leading-tight"></span>
        </div>
        
        <div class="flex items-center gap-2 phone-container">
          <span class="text-slate-500">📞</span>
          <span class="phone font-mono text-slate-200"></span>
          <button class="btn-copy text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-slate-400 hover:text-white transition-colors ml-auto border border-slate-700">Copy</button>
        </div>
      </div>
      
      <div class="flex gap-2 mt-5 pt-4 border-t border-white/5">
        <a href="#" target="_blank" class="link-maps flex-1 text-center py-2 bg-slate-800 hover:bg-blue-600 hover:text-white text-blue-400 text-sm font-medium rounded-lg transition-colors border border-blue-900/30">
          🗺️ Maps
        </a>
        <button class="btn-save flex-1 py-2 bg-slate-800 hover:bg-amber-600 hover:text-white text-amber-400 text-sm font-medium rounded-lg transition-colors border border-amber-900/30">
          ⭐ Save
        </button>
      </div>
    </div>
  </template>

  <!-- Template: Skeleton Card -->
  <template id="tpl-skeleton-card">
    <div class="bg-card border border-white/5 rounded-xl p-5 h-[220px] flex flex-col gap-4 animate-shimmer">
      <div class="h-6 w-3/4 bg-white/5 rounded"></div>
      <div class="h-4 w-1/4 bg-white/5 rounded"></div>
      <div class="mt-auto space-y-3">
        <div class="h-4 w-full bg-white/5 rounded"></div>
        <div class="h-4 w-2/3 bg-white/5 rounded"></div>
      </div>
      <div class="flex gap-2 mt-2">
        <div class="h-9 flex-1 bg-white/5 rounded-lg"></div>
        <div class="h-9 flex-1 bg-white/5 rounded-lg"></div>
      </div>
    </div>
  </template>

  <!-- Main App Script -->
  <script type="module" src="app.js"></script>

  <!-- Toggle CSS Hack -->
  <style>
    #toggle-no-website:checked ~ .dot { transform: translateX(100%); background-color: #3b82f6; }
    #toggle-no-website:checked ~ .block { background-color: #1e3a8a; }
  </style>
</body>
</html>
